<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Message For My beautiful Sister ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0b0c;
      color: #f5eeee;
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    .small {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 38px;
      font-weight: normal;
      margin: 0 0 12px;
    }

    .message {
      font-size: 18px;
      line-height: 1.7;
      opacity: 0.75;
      margin: 0 auto 30px;
    }

    video {
      width: 100%;
      max-height: 75vh;
      border-radius: 14px;
      display: block;
      background: #000;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }

    .heart {
      margin-top: 28px;
      font-size: 22px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="small">A little something for you</div>

    <h1>For my beautiful sister ❤️</h1>

    <p class="message">
      Before this new chapter begins, I wanted you to have something
      you could keep forever.
    </p>

    <video controls playsinline preload="metadata">
      <source src="sister.mp4" type="video/mp4">
      Your browser does not support video playback.
    </video>

    <div class="heart">With love, always ❤️</div>

  </div>

</body>
</html>
